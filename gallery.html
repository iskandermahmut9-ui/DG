<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея | Dmitriy Gavrilenko</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Стили специально для сетки галереи (чтобы не менять основной style.css) */
        .photo-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 5%;
            max-width: 1200px;
            margin: 0 auto 100px auto;
        }
        .photo-frame {
            background: #111; /* Цвет рамки */
            padding: 10px;    /* Толщина рамки */
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .photo-frame:hover {
            transform: translateY(-5px);
            border-color: #00c6ff;
        }
        .photo-frame img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>

    <nav>
        <a href="index.html" class="logo-container hover-target">

    <div style="height: 120px;"></div>

    <h1 class="projects-main-header zoom-effect hover-target" style="text-align: center;">ГАЛЕРЕЯ</h1>

    <!-- Сетка с фотографиями -->
    <div class="photo-gallery-grid">
        <!-- Фото 1 -->
        <div class="photo-frame hover-target">
            <!-- Класс gallery-img должен активировать ваш lightbox из script.js -->
            <img src="gallery1.jpg" class="gallery-img" alt="Фото 1">

    </div>

    <!-- Модальное окно для увеличения фото (из вашего проекта) -->

        <span class="close-btn" id="lightbox-close">&times;</span>

        <img class="lightbox-content" id="lightbox-img" src="">
